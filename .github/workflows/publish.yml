name: Publish

on:
  release:
    types: [published]

permissions: read-all

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Run typecheck and tests
        run: pnpm typecheck && pnpm test

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public --provenance

      - name: Generate SBOM (CycloneDX)
        run: pnpm run sbom

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download published tarball from npm (with retries for CDN lag)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for i in $(seq 1 12); do
            if npm pack "stellar-hd-wallet@${VERSION}"; then
              exit 0
            fi
            echo "Version ${VERSION} not visible on the registry yet (attempt ${i}/12); retrying in 20s..."
            sleep 20
          done
          echo "Version ${VERSION} never appeared on the registry."
          exit 1

      - name: Sign tarball (keyless)
        run: cosign sign-blob --yes --bundle stellar-hd-wallet-*.tgz.sigstore stellar-hd-wallet-*.tgz

      - name: Sign SBOM (keyless)
        run: cosign sign-blob --yes --bundle stellar-hd-wallet-*.sbom.cdx.json.sigstore stellar-hd-wallet-*.sbom.cdx.json

      - name: Attach tarball, SBOM, and signatures to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" stellar-hd-wallet-*.tgz stellar-hd-wallet-*.tgz.sigstore stellar-hd-wallet-*.sbom.cdx.json stellar-hd-wallet-*.sbom.cdx.json.sigstore --clobber
