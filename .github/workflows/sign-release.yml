name: Sign release

# Signs the published npm tarball and SBOM keylessly (Sigstore) and attaches
# them, along with their .sigstore bundles, to a GitHub release. Useful for
# re-signing an existing release without republishing to npm.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to sign (e.g. 2.0.2)"
        required: true
      tag:
        description: "GitHub release tag (defaults to v<version>)"
        required: false

permissions: read-all

concurrency:
  group: sign-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download published tarball from npm (with retries for CDN lag)
        run: |
          VERSION="${{ inputs.version }}"
          for i in $(seq 1 12); do
            if npm pack "stellar-hd-wallet@${VERSION}"; then
              exit 0
            fi
            echo "Version ${VERSION} not visible on the registry yet (attempt ${i}/12); retrying in 20s..."
            sleep 20
          done
          echo "Version ${VERSION} never appeared on the registry."
          exit 1

      - name: Generate SBOM (CycloneDX)
        run: pnpm run sbom

      - name: Sign tarball (keyless)
        run: cosign sign-blob --yes --bundle stellar-hd-wallet-*.tgz.sigstore stellar-hd-wallet-*.tgz

      - name: Sign SBOM (keyless)
        run: cosign sign-blob --yes --bundle stellar-hd-wallet-*.sbom.cdx.json.sigstore stellar-hd-wallet-*.sbom.cdx.json

      - name: Attach tarball, SBOM, and signatures to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || format('v{0}', inputs.version) }}
        run: gh release upload "${TAG}" stellar-hd-wallet-*.tgz stellar-hd-wallet-*.tgz.sigstore stellar-hd-wallet-*.sbom.cdx.json stellar-hd-wallet-*.sbom.cdx.json.sigstore --clobber
